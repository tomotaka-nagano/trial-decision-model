services:
  app:
    build:
      context: .
      secrets:
        - github_token
    user: "1001:1001"
    init: true
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8512}:8000"
    environment:
      HOME: /tmp
      AZURE_CONFIG_DIR: /azure
      AZURE_CORE_COLLECT_TELEMETRY: "no"
    volumes:
      - type: bind
        source: ./env.toml
        target: /app/env.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.azure
        target: /azure
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  github_token:
    environment: GITHUB_TOKEN